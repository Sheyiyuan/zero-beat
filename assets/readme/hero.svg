  <title id="hero-title">zero-beat 零拍：两个平台，为你同频</title>
  <desc id="hero-desc">Bilibili 与网易云音乐双源 TUI 播放器。两路波形逐渐同频，汇入同一条播放队列；右侧播放器正在播放网易云音乐的心做し。</desc>

