name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "zero-beat-site/**"
      - "zero-beat-tui"
      - "zero-beat-gui"
      - "zero-beat-core"
      - ".gitmodules"
      - "docs/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zero-beat-site/pnpm-lock.yaml

      - name: Install
        working-directory: zero-beat-site
        run: pnpm install --frozen-lockfile

      - name: Check documentation sources
        run: python3 scripts/check-doc-links.py

      - name: Build
        working-directory: zero-beat-site
        env:
          # 项目页地址是 https://<owner>.github.io/<repo>/；自定义域名时改成 /
          SITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: zero-beat-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
